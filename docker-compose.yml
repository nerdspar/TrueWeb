# =============================================================================
# TrueWeb — phone-first TrueNAS app manager.
# The image is built by GitHub Actions and pulled from GHCR; TrueNAS just runs
# it. There is no .env file — paste your values at the ⬅ markers below.
#
# ── 1. Create the service account and API key (see DEPLOY.md) ────────────────
#      A dedicated user with only the roles TrueWeb needs, then a user-linked
#      API key against that account. Do NOT use a FULL_ADMIN or root key: this
#      container can start, stop and redeploy every app you own.
#
# ── 2. Paste your values at the ⬅ markers ────────────────────────────────────
#
# ── 3. Log in to GHCR once (private image) and launch ────────────────────────
#        docker login ghcr.io -u nerdspar     # paste a read:packages PAT
#        docker compose up -d
#      Then on the iPhone: http://<nas-ip>:8110 → Share → Add to Home Screen.
# =============================================================================

services:
  trueweb:
    # Built by .github/workflows/docker-publish.yml. To build on the box
    # instead, comment out `image:` and uncomment `build: .`.
    image: ghcr.io/nerdspar/trueweb:latest
    # build: .
    container_name: trueweb
    restart: unless-stopped
    environment:
      TZ: "America/New_York"

      # ── TrueNAS middleware ──────────────────────────────────────────────
      # Reach the box directly on the LAN, NOT through the reverse proxy (§10).
      # If Nginx Proxy Manager owns 443 on this IP, TrueNAS's own UI is on 444.
      TRUENAS_HOST: "10.0.1.14:444" # ⬅ TRUENAS_HOST

      # Service-account API key. Never logged, never returned in a response.
      TRUENAS_API_KEY: "PASTE_TRUENAS_API_KEY_HERE" # ⬅ TRUENAS_API_KEY

      # The username the key belongs to — auth.login_ex takes both.
      TRUENAS_API_KEY_USERNAME: "trueweb" # ⬅ TRUENAS_API_KEY_USERNAME

      # TrueNAS ships a self-signed certificate, so this is normally false on
      # the LAN. Anything other than "false" is treated as true.
      TRUENAS_VERIFY_TLS: "false"

      # Only needed if the box refuses a bare-IP handshake (TLS alert 112).
      # Leave empty unless you hit that; see DEPLOY.md.
      TRUENAS_TLS_SERVERNAME: "" # ⬅ TRUENAS_TLS_SERVERNAME (optional)

      # ── Compose edit history (optional, off by default) ─────────────────
      # Set this to a mounted directory and TrueWeb keeps the last 10 saved
      # composes per app, so a bad YAML edit survives a restart. Left empty,
      # that history lives in memory and is cleared when the container
      # restarts.
      #
      # It is off by default deliberately: a compose file holds its app's
      # environment verbatim, and TrueWeb's own compose holds
      # TRUENAS_API_KEY — which §7 says is never written to disk. Turning this
      # on trades that rule for a durable undo. The file is written 0600; put
      # it somewhere only root can read, and uncomment the matching volume
      # below.
      TRUEWEB_STATE_DIR: "" # ⬅ e.g. /data (optional)

      # ── App gate (optional) ─────────────────────────────────────────────
      # A single shared passcode as a bcrypt hash. Leave both empty on a
      # trusted LAN and TrueWeb is ungated. Set them before exposing it
      # through a reverse proxy or tunnel — it holds an API key that can
      # restart every app you run.
      #   Hash:   docker run --rm node:22-alpine sh -c "npm -s i bcryptjs >/dev/null 2>&1; node -e \"console.log(require('bcryptjs').hashSync(process.argv[1],12))\" 'your-passcode'"
      #   Secret: openssl rand -hex 32
      TRUEWEB_PASSCODE_HASH: "" # ⬅ TRUEWEB_PASSCODE_HASH (optional)
      TRUEWEB_SESSION_SECRET: "" # ⬅ TRUEWEB_SESSION_SECRET (required if gated)

      # The path inside this container; see the volume below. Only change it
      # if you mount the log somewhere else.
      TRUEWEB_APP_LIFECYCLE_LOG: "/var/log/app_lifecycle.log"

    ports:
      # host:container — the app listens on 8110 inside the container. Change
      # the LEFT number if 8110 is taken on your NAS.
      - "8110:8110"

    # The lifecycle log is root:adm mode 640 on the host — group-readable only,
    # and this container runs as `node` (uid 1000), so the mount alone gives
    # EACCES. Joining gid 4 (adm) grants exactly the read it needs and nothing
    # else; running the container as root would work too and give away far more.
    # Check yours if it differs:  ls -l /var/log/app_lifecycle.log
    group_add:
      - "4"

    volumes:
      # Why this mount exists: when an app fails to come up, TrueNAS records a
      # one-line error pointing at this file and nothing else — the job carries
      # no logs at all, and the only API route to the file needs the HTTP
      # download endpoint this project doesn't use. The log lives on the host,
      # so TrueWeb reads it from disk. Read-only, and it is the difference
      # between "failed, check a log you can't see" and being shown the reason.
      - /var/log/app_lifecycle.log:/var/log/app_lifecycle.log:ro

      # Uncomment together with TRUEWEB_STATE_DIR above to keep compose edit
      # history across restarts. Read the note there first — it puts app
      # environments, secrets included, on disk.
      # - /mnt/NAS/Apps/trueweb-state:/data

    healthcheck:
      # Reports unhealthy only if the web server is down or the API key is
      # missing/rejected. A briefly unreachable middleware is normal — a
      # middleware restart must not make the container look broken.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8110/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
