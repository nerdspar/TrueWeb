<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="TrueWeb">
	<!-- App-icon source. Full-bleed on purpose: iOS masks apple-touch-icons with
	     its own rounded square, so any transparent/rounded corner here shows up
	     as a dark fringe. The glyph sits inside the central 80% so the same
	     artwork also works as an Android maskable icon.
	     Regenerate the PNGs in static/ with brand/render-icons.sh -->
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#00c2ff" />
			<stop offset="0.55" stop-color="#3b6eff" />
			<stop offset="1" stop-color="#6d5eff" />
		</linearGradient>
	</defs>
	<rect width="64" height="64" fill="url(#bg)" />
	<!-- three stacked bars: a NAS/storage glyph, in the near-black ground colour -->
	<g fill="#07080b">
		<rect x="16" y="18" width="32" height="8" rx="4" />
		<rect x="16" y="30" width="32" height="8" rx="4" opacity="0.82" />
		<rect x="16" y="42" width="32" height="8" rx="4" opacity="0.64" />
	</g>
</svg>
