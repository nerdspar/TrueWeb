<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- Deliberately NOT viewport-fit=cover. With `cover` the web view spans the
		     whole screen and iOS 26+/27 draws its uncloseable "Liquid Glass" scroll-
		     edge blur over the top of a standalone PWA. Without it, iOS keeps content
		     inside the safe area (below the status bar) so the blur ramp has nothing
		     to fall on; the status-bar tint strip below finishes the job. --sa-bottom
		     then reads 0, so app.css reserves the home-indicator height in standalone. -->
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<!-- Single dark theme (§8): no switcher, so the chrome is pinned dark. -->
		<meta name="color-scheme" content="dark" />
		<meta name="theme-color" content="#07080B" />
		<title>TrueWeb</title>

		<link rel="manifest" href="/manifest.webmanifest" />

		<!-- iOS picks per device: 180 iPhone @3x, 167 iPad Pro, 152 iPad, 120
		     iPhone @2x. Without the smaller entries it downsamples the 180.
		     iOS captures the home-screen icon once at install and never
		     refreshes it, so bump ?v= whenever the artwork changes
		     (see brand/render-icons.sh). -->
		<link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png?v=1" />
		<link rel="apple-touch-icon" sizes="167x167" href="/icon-167.png?v=1" />
		<link rel="apple-touch-icon" sizes="152x152" href="/icon-152.png?v=1" />
		<link rel="apple-touch-icon" sizes="120x120" href="/icon-120.png?v=1" />
		<link rel="icon" href="/favicon.svg?v=1" type="image/svg+xml" />
		<link rel="icon" sizes="32x32" type="image/png" href="/favicon-32.png?v=1" />

		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<!-- `default` (opaque), not black-translucent. iOS 26+/27 draws the uncloseable
		     "Liquid Glass" top-edge blur on a standalone PWA under black-translucent;
		     `default` gives an opaque status bar coloured by theme-color, and no-cover
		     (above) keeps content out of that strip. Frozen at install — takes effect
		     only after the app is removed and re-added to the Home Screen. -->
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="TrueWeb" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="tap">
		<!-- Status-bar tint strip. A real, fixed, opaque element at the very top edge:
		     iOS 26+/27 samples it as solid status-bar chrome and suppresses the top
		     blur ramp. Standalone + portrait only (see app.css); display:none in a
		     browser tab. -->
		<div class="status-tint" aria-hidden="true"></div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
